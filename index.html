<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة المافيا الجماعية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>لعبة المافيا 🕵️‍♂️</h2>

    <!-- الشاشة الأولى: دخول وغرف -->
    <div id="login-screen">
      <input type="text" id="username" placeholder="أدخل اسمك هنا" required>
      <hr>
      <button id="btn-create" onclick="createRoom()">إنشاء فريق (غرفة)</button>
      <br><br>
      <input type="number" id="room-code-input" placeholder="رقم الغرفة">
      <button id="btn-join" onclick="joinRoom()">انضمام إلى فريق</button>
    </div>

    <!-- الشاشة الثانية: صالة الانتظار والإعدادات -->
    <div id="lobby-screen" class="hidden">
      <h3>رقم الغرفة: <span id="display-room-code" class="highlight"></span></h3>
      <h4>اللاعبون المتواجدون:</h4>
      <ul id="players-list"></ul>

      <div id="host-controls" class="hidden">
        <hr>
        <h4>إعدادات اللعبة:</h4>
        <label>عدد المافيا: <input type="number" id="mafia-count" value="1" min="1"></label><br>
        <label><input type="checkbox" id="has-doctor" checked> طبيب</label><br>
        <label><input type="checkbox" id="has-detective" checked> محقق</label><br>
        <label><input type="checkbox" id="has-avenger" checked> منتقم</label><br><br>
        <button onclick="startGame()">ابدأ اللعب 🚀</button>
      </div>
      <p id="waiting-msg" class="hidden">في انتظار رئيس الغرفة لبدء اللعبة...</p>
      <br>
      <button onclick="goBackToMain()" style="background-color: #6c757d;">مغادرة الغرفة 🚪</button>
    </div>

    <!-- الشاشة الثالثة: داخل اللعبة -->
    <div id="game-screen" class="hidden">
      <h3>دورك في اللعبة: <span id="my-role" class="highlight"></span></h3>
      <div id="role-description" class="role-desc"></div>
      <hr>
      <h4>اللاعبون الأحياء:</h4>
      <div id="game-players-list"></div>
      <div id="action-result" class="result-box hidden"></div>
      <div id="avenger-box" class="hidden">
        <hr>
        <button onclick="useAvengerPower()" class="btn-danger">استخدام قوة المنتقم (استبعاد شخص معك)</button>
      </div>
    </div>

    <!-- الشاشة الرابعة: شاشة النهاية -->
    <div id="end-screen" class="hidden">
      <h3>🎉 انتهت اللعبة!</h3>
      <h4>الفريق الفائز: <span id="winner-team" class="highlight"></span></h4>
      <hr>
      <h4>أدوار جميع اللاعبين:</h4>
      <div id="revealed-roles-list"></div>
      <br>
      <button onclick="resetGameToLobby()">إعادة اللعبة للوبي 🔄</button>
    </div>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module" src="app.js"></script>
</body>
</html>2
